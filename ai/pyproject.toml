[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Delger Byambasukh", email = "byambasu@msu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "transformers>=5.18.0",
    "tzdata>=2026.5",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
